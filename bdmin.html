<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>팡이케어 관리자 예약표</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6fa;color:#222}
header{background:#172033;color:#fff;padding:18px 24px}header h1{margin:0;font-size:22px}
.wrap{padding:20px;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px}
.panel,.calendar{background:#fff;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.07);padding:16px}
.panel h2,.calendar h2{margin:4px 0 14px}.pending-list{min-height:150px}
.pending-card{background:#fff8df;border:1px solid #ead38a;border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab}
.pending-card strong{display:block;margin-bottom:5px}.muted{font-size:12px;color:#666}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:9px 12px;cursor:pointer}.nav{background:#edf1f7}.primary{background:#1769e0;color:#fff}.danger{background:#e74c3c;color:#fff}
.calendar-wrap{overflow:auto}.calendar-grid{display:grid;grid-template-columns:90px repeat(7,minmax(150px,1fr));min-width:1140px}
.cell{border-right:1px solid #ddd;border-bottom:1px solid #ddd;min-height:72px;padding:6px}
.head{background:#eef2f7;font-weight:700;text-align:center;min-height:52px}.time{background:#fafafa;font-weight:700;text-align:center}
.slot{background:#fff;transition:.1s}.slot.over{background:#e8f2ff}.booking{background:#eaf4ff;border-left:5px solid #1769e0;border-radius:7px;padding:7px;cursor:pointer;min-height:58px}.booking.completed{background:#dbeeff;border-left-color:#0878d1}
.booking .name{font-weight:700}.booking .price{font-size:12px;margin-top:3px}.booking .memo{font-size:11px;color:#555;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:#aaa;text-align:center;padding-top:10px}.badge{display:inline-block;background:#fff1c7;border-radius:20px;padding:4px 8px;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:14px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}
.modal h3{margin-top:0}.field{margin-bottom:12px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ccd3dd;border-radius:7px}.field textarea{min-height:90px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>팡이케어 관리자 예약표</h1></header>
<div class="wrap">
<div class="layout">
<section class="panel">
<h2>예약 대기</h2>
<div class="muted">고객 신청 → 상담 → 원하는 날짜/시간으로 드래그</div>
<div id="pendingList" class="pending-list"></div>
</section>

<section class="calendar">
<div class="toolbar">
<button class="nav" id="prev">◀ 이전</button>
<button class="nav" id="today">오늘</button>
<button class="nav" id="next">다음 ▶</button>
<span id="rangeTitle" class="badge"></span>
</div>
<div class="calendar-wrap"><div id="calendarGrid" class="calendar-grid"></div></div>
</section>
</div>
</div>

<div id="modalBg" class="modal-bg">
<div class="modal">
<h3 id="modalTitle">예약 상세</h3>
<div id="modalContent"></div>
<div class="actions">
<button class="nav" onclick="closeModal()">닫기</button>
<button class="primary" onclick="saveBooking()">저장</button>
<button class="danger" onclick="cancelBooking()">예약 취소</button>
</div>
</div>
</div>

<script>
const KEY="pangicareReservations";
const TIMES=["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00"];
let reservations=JSON.parse(localStorage.getItem(KEY)||"[]");
let baseDate=new Date(); baseDate.setHours(0,0,0,0);
let editingId=null;

function saveAll(){localStorage.setItem(KEY,JSON.stringify(reservations))}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}

function renderPending(){
 const el=document.getElementById("pendingList"); el.innerHTML="";
 const list=reservations.filter(r=>r.status==="pending");
 if(!list.length){el.innerHTML='<div class="empty">대기 중인 예약이 없습니다.</div>';return}
 list.forEach(r=>{
   const card=document.createElement("div"); card.className="pending-card"; card.draggable=true; card.dataset.id=r.id;
   card.innerHTML=`<strong>${esc(r.name)} · ${esc(r.service)}</strong>
   <div>${esc(r.phone)}</div><div class="muted">${esc(r.address)}</div>
   <div class="muted">희망: ${r.preferredDate||"미지정"} / ${r.preferredTime||"상관없음"}</div>`;
   card.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",r.id));
   card.addEventListener("click",()=>openModal(r.id));
   el.appendChild(card);
 });
}
function renderCalendar(){
 const grid=document.getElementById("calendarGrid");grid.innerHTML="";
 const heads=["시간"];
 for(let i=0;i<7;i++){const d=addDays(baseDate,i);heads.push(`${d.getMonth()+1}/${d.getDate()} (${["일","월","화","수","목","금","토"][d.getDay()]})`)}
 heads.forEach((h,i)=>{const c=document.createElement("div");c.className="cell head";c.textContent=h;grid.appendChild(c)});
 for(const t of TIMES){
   let c=document.createElement("div");c.className="cell time";c.textContent=t;grid.appendChild(c);
   for(let i=0;i<7;i++){
     const d=addDays(baseDate,i), date=iso(d);
     c=document.createElement("div");c.className="cell slot";c.dataset.date=date;c.dataset.time=t;
     c.addEventListener("dragover",e=>{e.preventDefault();c.classList.add("over")});
     c.addEventListener("dragleave",()=>c.classList.remove("over"));
     c.addEventListener("drop",e=>{e.preventDefault();c.classList.remove("over");dropToSlot(e.dataTransfer.getData("text/plain"),date,t)});
     const r=reservations.find(x=>x.scheduledDate===date&&x.scheduledTime===t&&x.status==="confirmed");
     if(r)c.appendChild(bookingEl(r)); else c.innerHTML='<div class="empty">+</div>';
     grid.appendChild(c);
   }
 }
 document.getElementById("rangeTitle").textContent=`${fmt(baseDate)} ~ ${fmt(addDays(baseDate,6))}`;
}
function bookingEl(r){
 const d=document.createElement("div");d.className="booking"+(r.completed?" completed":"");d.draggable=true;
 d.innerHTML=`<div class="name">${esc(r.name)}</div><div>${esc(r.service)} ${r.quantity||1}대</div>
 <div class="price">${r.price?Number(r.price).toLocaleString()+"원":"가격 미입력"}</div>
 <div class="memo">${esc(r.adminMemo||"메모 없음")}</div>`;
 d.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",r.id));
 d.addEventListener("click",e=>{e.stopPropagation();openModal(r.id)});
 return d;
}
function dropToSlot(id,date,time){
 const r=reservations.find(x=>x.id===id);if(!r)return;
 const conflict=reservations.find(x=>x.id!==id&&x.status==="confirmed"&&x.scheduledDate===date&&x.scheduledTime===time);
 if(conflict){alert("이미 예약이 있는 시간입니다.");return}
 r.status="confirmed";r.scheduledDate=date;r.scheduledTime=time;saveAll();renderPending();renderCalendar();
}
function openModal(id){
 editingId=id;const r=reservations.find(x=>x.id===id);if(!r)return;
 document.getElementById("modalTitle").textContent=`${r.name} 예약`;
 document.getElementById("modalContent").innerHTML=`
 <div class="field"><label>고객</label><div>${esc(r.name)} / ${esc(r.phone)}</div></div>
 <div class="field"><label>주소</label><div>${esc(r.address)}</div></div>
 <div class="field"><label>청소</label><div>${esc(r.service)} ${r.quantity||1}대</div></div>
 <div class="field"><label>고객 요청사항</label><div>${esc(r.customerMemo||"없음")}</div></div>
 <div class="field"><label>예약 날짜</label><input id="editDate" type="date" value="${r.scheduledDate||r.preferredDate||""}"></div>
 <div class="field"><label>예약 시간</label><select id="editTime">${TIMES.map(t=>`<option ${t===(r.scheduledTime||r.preferredTime)?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="field"><label>가격</label><input id="editPrice" type="number" min="0" value="${esc(r.price||"")}" placeholder="예: 150000"></div>
 <div class="field"><label>관리자 메모</label><textarea id="editMemo" placeholder="주차, 현장상태, 상담내용 등을 입력">${esc(r.adminMemo||"")}</textarea></div>
 <div class="field"><label>상태</label><div>${r.status==="pending"?"상담 대기":"예약 확정"} ${r.completed?" / 작업 완료":""}</div></div>`;
 document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none";editingId=null}
function saveBooking(){
 const r=reservations.find(x=>x.id===editingId);if(!r)return;
 r.scheduledDate=document.getElementById("editDate").value;
 r.scheduledTime=document.getElementById("editTime").value;
 r.price=document.getElementById("editPrice").value;
 r.adminMemo=document.getElementById("editMemo").value.trim();
 if(r.scheduledDate&&r.scheduledTime){
   const conflict=reservations.find(x=>x.id!==r.id&&x.status==="confirmed"&&x.scheduledDate===r.scheduledDate&&x.scheduledTime===r.scheduledTime);
   if(conflict){alert("이미 예약된 시간입니다.");return}
   r.status="confirmed";
 }
 saveAll();closeModal();renderPending();renderCalendar();
}
function cancelBooking(){
 const r=reservations.find(x=>x.id===editingId);if(!r)return;
 if(!confirm("이 예약을 취소 처리할까요?"))return;
 r.status="cancelled";saveAll();closeModal();renderPending();renderCalendar();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

document.getElementById("prev").onclick=()=>{baseDate=addDays(baseDate,-7);renderCalendar()}
document.getElementById("next").onclick=()=>{baseDate=addDays(baseDate,7);renderCalendar()}
document.getElementById("today").onclick=()=>{baseDate=new Date();baseDate.setHours(0,0,0,0);renderCalendar()}
renderPending();renderCalendar();
</script>
</body>
</html>
